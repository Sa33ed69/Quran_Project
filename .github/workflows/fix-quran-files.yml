
name: Fix Quran API URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-quran:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          pwd
          ls -la
          ls -la .github
          ls -la .github/scripts
          test -f .github/scripts/fix-quran-files.js
