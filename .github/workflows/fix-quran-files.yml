
name: Fix Quran API URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-quran:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check fixer script
        run: test -f .github/scripts/fix-quran-files.js

      - name: Run JavaScript fixer
        run: node .github/scripts/fix-quran-files.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.js'

          if git diff --cached --quiet; then
            echo "No files needed updating."
          else
            git commit -m "Fix Quran API URLs in surah files"
            git push
          fi
